<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechor - Planificateur de Voyage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* JavaFX Timeline Styles */
        .timeline-container { position: relative; height: 24px; margin: 0 15px; grid-area: timeline; }
        .center-line { position: absolute; top: 50%; width: 100%; height: 2px; background: #cbd5e0; transform: translateY(-50%); }
        .circle { position: absolute; top: 50%; width: 8px; height: 8px; background: white; border: 1.5px solid #6366f1; border-radius: 50%; transform: translate(-50%, -50%); z-index: 2; }
        .dep-arr-circle { width: 10px; height: 10px; background: #4338ca; border: none; }

        /* Detail UI Styles (Red Connection Line) */
        .leg-row { display: grid; grid-template-columns: 80px 40px 1fr 60px; align-items: start; position: relative; }
        .red-connection-line { position: absolute; left: 99px; top: 15px; bottom: 5px; width: 2px; background-color: #ef4444; z-index: 0; }
        .detail-circle { width: 10px; height: 10px; background: white; border: 2px solid #ef444400; border-radius: 50%; margin-top: 6px; z-index: 1; position: relative; }
        
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <div class="max-w-2xl mx-auto py-8 px-4">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-black text-indigo-700 tracking-tight">RECHOR WEB</h1>
            <p class="text-gray-500 uppercase text-xs tracking-widest font-bold font-sans">Extension du projet du cours CS-107 en 2025</p>
            <a href="/swagger-ui/index.html" target="_blank" class="inline-flex items-center gap-1 mt-2 text-indigo-400 hover:text-indigo-600 text-[10px] font-bold uppercase tracking-widest transition-colors">
                <i data-lucide="external-link" class="w-3 h-3"></i> Documentation API
            </a>
        </header>

        <div class="bg-white shadow-xl rounded-2xl p-6 mb-6">
            <form id="searchForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="relative">
                        <label class="text-xs font-bold text-gray-400 uppercase">Départ</label>
                        <input type="text" id="from" required autocomplete="off" class="w-full border-b-2 border-gray-100 focus:border-indigo-500 outline-none py-2 transition" placeholder="Lieu de départ">
                        <div id="fromSugg" class="absolute z-50 w-full bg-white shadow-2xl rounded-b-lg hidden max-h-60 overflow-y-auto border-t"></div>
                    </div>
                    <div class="relative">
                        <label class="text-xs font-bold text-gray-400 uppercase">Arrivée</label>
                        <input type="text" id="to" required autocomplete="off" class="w-full border-b-2 border-gray-100 focus:border-indigo-500 outline-none py-2 transition" placeholder="Destination">
                        <div id="toSugg" class="absolute z-50 w-full bg-white shadow-2xl rounded-b-lg hidden max-h-60 overflow-y-auto border-t"></div>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <select id="type" class="border rounded p-2 text-sm bg-white">
                        <option value="DEPARTURE">Départ à</option>
                        <option value="ARRIVAL">Arrivée à</option>
                    </select>
                    <input type="date" id="date" value="2025-05-30" class="border rounded p-2 text-sm">
                    <input type="time" id="time" value="13:00" class="border rounded p-2 text-sm">
                </div>
                <button type="submit" id="searchBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 flex justify-center items-center gap-2 transition active:scale-95">
                    <span id="searchBtnText">Trouver un voyage</span>
                </button>
            </form>
        </div>

        <div id="results" class="space-y-3"></div>
    </div>

    <div id="detailPanel" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end md:items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-bold text-lg">Détails du voyage</h2>
                <button onclick="closeDetails()" class="p-2 hover:bg-gray-200 rounded-full">✕</button>
            </div>
            <div id="detailContent" class="overflow-y-auto p-6"></div>
            <div class="p-4 border-t bg-gray-50 flex gap-3">
                <button id="calBtn" class="flex-1 bg-white border border-gray-300 py-2 rounded-lg font-medium hover:bg-gray-100 flex justify-center items-center gap-2">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Calendrier
                </button>
                <button id="mapBtn" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 flex justify-center items-center gap-2">
                    <i data-lucide="map" class="w-4 h-4"></i> Carte
                </button>
            </div>
        </div>
    </div>

    <script>
        const API = "";
        let currentSearchId = null; 

        const fmt = (iso) => iso.split('T')[1].substring(0, 5);

        // --- Autocomplete with "Lose Focus" logic ---
        function setupAutocomplete(id, suggId) {
            const input = document.getElementById(id);
            const sugg = document.getElementById(suggId);

            input.addEventListener('input', async () => {
                if(input.value.length < 2) return sugg.classList.add('hidden');
                try {
                    const res = await fetch(`${API}/stops?query=${encodeURIComponent(input.value)}&limit=6`);
                    const stops = await res.json();
                    if(stops.length === 0) return sugg.classList.add('hidden');
                    
                    sugg.innerHTML = stops.map(s => `<div class="p-3 hover:bg-indigo-50 cursor-pointer border-b text-sm transition-colors">${s}</div>`).join('');
                    sugg.classList.remove('hidden');

                    sugg.querySelectorAll('div').forEach(d => {
                        d.onmousedown = (e) => { 
                            // Use onmousedown to trigger before blur
                            input.value = d.innerText;
                            sugg.classList.add('hidden');
                        };
                    });
                } catch(e) {}
            });

            // If user clicks away (blur), hide the suggestions
            input.addEventListener('blur', () => {
                // Timeout allows the click on a suggestion to register first
                setTimeout(() => sugg.classList.add('hidden'), 200);
            });
        }

        setupAutocomplete('from', 'fromSugg');
        setupAutocomplete('to', 'toSugg');

        // --- Search Handler ---
        document.getElementById('searchForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('searchBtn');
            const btnText = document.getElementById('searchBtnText');
            
            btn.disabled = true;
            btnText.innerHTML = `<svg class="spinner w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Recherche...`;

            try {
                const res = await fetch(`${API}/journeys?from=${document.getElementById('from').value}&to=${document.getElementById('to').value}&date=${document.getElementById('date').value}&time=${document.getElementById('time').value}&type=${document.getElementById('type').value}&limit=10`);
                if(!res.ok) throw await res.json();
                
                const data = await res.json(); // Now returns { searchId: "", journeys: [] }
                currentSearchId = data.searchId;
                renderList(data.journeys);
            } catch (err) {
                alert("Erreur: " + (err.message || "Erreur de connexion"));
            } finally {
                btn.disabled = false;
                btnText.innerText = "Trouver un voyage";
            }
        };

        function renderList(journeys) {
            const container = document.getElementById('results');
            
            // 1. Check if the array is empty
            if (!journeys || journeys.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-sm border-2 border-dashed border-gray-200 text-center">
                        <div class="flex justify-center mb-4 text-gray-300">
                            <i data-lucide="search-x" class="w-12 h-12"></i>
                        </div>
                        <h3 class="font-bold text-lg text-gray-700">Aucun voyage trouvé</h3>
                        <p class="text-sm text-gray-500 mt-1">
                            Essayez de modifier vos critères de recherche ou de choisir une autre date.
                        </p>
                    </div>`;
                lucide.createIcons(); // Initialize the search-x icon
                return;
            }

            // 2. Existing logic for finding the selected index
            const searchTime = document.getElementById('time').value;
            let selectedIdx = journeys.findIndex(j => fmt(j.legs[0].depTime) >= searchTime);
            if (selectedIdx === -1) selectedIdx = journeys.length - 1;

            // 3. Render the list as usual
            container.innerHTML = journeys.map((j, i) => {
                const first = j.legs[0], last = j.legs[j.legs.length-1];
                const isSel = i === selectedIdx;
                return `
                <div onclick='openDetails(${JSON.stringify(j)}, ${i})' class="bg-white p-4 rounded-xl shadow-sm border-2 cursor-pointer transition ${isSel ? 'border-indigo-500 ring-4 ring-indigo-50' : 'border-transparent hover:border-gray-200'}">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xl font-black">${fmt(first.depTime)}</span>
                        <div class="flex items-center gap-1 text-gray-400 text-[10px] font-bold tracking-widest uppercase">
                            <i data-lucide="move-right" class="w-3 h-3"></i>
                            <span>${Math.round((new Date(last.arrTime) - new Date(first.depTime))/60000)} MIN</span>
                        </div>
                        <span class="text-xl font-black">${fmt(last.arrTime)}</span>
                    </div>
                    <div class="timeline-container">
                        <div class="center-line"></div>
                        <div class="circle dep-arr-circle" style="left:0%"></div>
                        <div class="circle dep-arr-circle" style="left:100%"></div>
                    </div>
                </div>`;
            }).join('');
            
            lucide.createIcons();
        }

        function openDetails(journey, index) {
            const content = document.getElementById('detailContent');
            let html = `<div class="space-y-0">`;

            journey.legs.forEach(leg => {
                if (!leg.vehicle) {
                    html += `<div class="pl-24 py-6 text-[10px] text-gray-400 font-black italic border-l-2 ml-[99px] flex items-center gap-2 uppercase tracking-tight"><i data-lucide="footprints" class="w-4 h-4"></i> Marche vers ${leg.arrStop.name}</div>`;
                } else {
                    html += `
                    <div class="relative">
                        <div class="red-connection-line"></div>
                        <div class="leg-row font-bold">
                            <div class="text-right pr-4 text-indigo-600">${fmt(leg.depTime)}</div>
                            <div class="detail-circle"></div>
                            <div class="text-sm">${leg.depStop.name}</div>
                            <div class="text-red-500 text-[10px] text-right">${leg.depStop.platformName || ''}</div>
                        </div>
                        <div class="leg-row my-4 text-sm">
                            <div></div>
                            <div class="flex justify-center"><i data-lucide="bus" class="w-5 h-5 text-gray-300"></i></div>
                            <div class="bg-gray-50 border p-3 rounded-xl flex justify-between items-center">
                                <span class="font-black text-indigo-700">${leg.vehicle} ${leg.route}</span>
                                <span class="text-[10px] uppercase text-gray-400 font-bold">Dir. ${leg.destination}</span>
                            </div>
                        </div>`;

                    if(leg.intermediateStops?.length > 0) {
                        html += `
                        <div class="leg-row mb-4">
                            <div></div><div></div>
                            <details class="w-full bg-white rounded-lg border border-dashed border-gray-300">
                                <summary class="p-2 text-[10px] font-black text-gray-400 cursor-pointer hover:bg-gray-50 flex justify-between items-center uppercase tracking-widest">
                                    ${leg.intermediateStops.length} arrêts
                                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                                </summary>
                                <div class="p-3 space-y-3 border-t">
                                    ${leg.intermediateStops.map(s => `
                                        <div class="grid grid-cols-4 text-[11px] items-center">
                                            <span class="text-gray-400 font-mono">${fmt(s.arrTime)}</span>
                                            <div class="w-1.5 h-1.5 rounded-full bg-red-200 justify-self-center"></div>
                                            <span class="col-span-2 font-medium">${s.stop.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </details>
                        </div>`;
                    }

                    html += `
                        <div class="leg-row font-bold">
                            <div class="text-right pr-4 text-indigo-600">${fmt(leg.arrTime)}</div>
                            <div class="detail-circle"></div>
                            <div class="text-sm">${leg.arrStop.name}</div>
                            <div class="text-red-500 text-[10px] text-right">${leg.arrStop.platformName || ''}</div>
                        </div>
                    </div>`;
                }
            });

            content.innerHTML = html + `</div>`;
            document.getElementById('detailPanel').classList.remove('hidden');
            lucide.createIcons();

            // Set up Map/Calendar with searchId and index
            document.getElementById('mapBtn').onclick = async () => {
                const url = `${API}/map?searchId=${currentSearchId}&index=${index}`;
                
                try {
                    // We use a 'HEAD' request or just fetch your OWN server
                    // This won't trigger CORS because we aren't following the redirect to uMap yet
                    const response = await fetch(url, { 
                        method: 'GET',
                        redirect: 'manual' // This is the key! It tells the browser NOT to follow the link to uMap
                    });

                    // 1. Handle Session Expired
                    if (response.status === 410) {
                        alert("Votre session de recherche a expiré. Veuillez relancer la recherche.");
                        closeDetails();
                        return;
                    }

                    // 2. If the session is fine, the server would normally return a 302 (Redirect)
                    // or a 200. Since it didn't return 410, the data exists!
                    // Now we open it normally, which bypasses CORS.
                    window.open(url, '_blank');

                } catch (e) {
                    // If the manual redirect check fails, we still try to open it 
                    // as a fallback, or show an error.
                    window.open(url, '_blank');
                }
            };

            document.getElementById('calBtn').onclick = async () => {
                try {
                    const response = await fetch(`${API}/ics?searchId=${currentSearchId}&index=${index}`);
                    
                    if (response.status === 410) {
                        alert("Votre session de recherche a expiré. Veuillez relancer la recherche.");
                        closeDetails();
                        return;
                    }

                    if (!response.ok) throw new Error();

                    // Handle the file download via Blob
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `voyage_${index}.ics`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                } catch (e) {
                    alert("Erreur lors du téléchargement du calendrier.");
                }
            };
        }

        function closeDetails() { document.getElementById('detailPanel').classList.add('hidden'); }
    </script>
</body>
</html>
