services:
  rechor-server:
    image: dev.zunion/rechor-server
    build:
      context: ..
      dockerfile: rechor-server/Dockerfile
    ports:
      - "8443:8443"
      - "8080:8080"
    # volumes:
    #   - ../rechor-logic/src/main/resources/timetable:/app/data/timetable:ro
    environment:
      - JAVA_OPTS=-Xmx512m -Xms512m -Dserver.port=8443 -Drechor.data.dir=/app/data
      - RECHOR_KEYSTORE_PASSWORD=${RECHOR_KEYSTORE_PASSWORD}
    restart: unless-stopped